name: Something reads wrong in the game
description: A mistranslation, a line cut off, a raw IGUI_RR_... key on screen.
title: "[TEXT] "
labels: ["text"]
body:
  - type: markdown
    attributes:
      value: |
        This is for the words only. **Bugs in the mod itself go to the Steam
        Workshop page** — this repository has no code in it.
  - type: input
    id: language
    attributes:
      label: Which language are you playing in?
      placeholder: German (DE)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you saw, and where
      description: >
        A screenshot says more than a paragraph. If the text is cut off, say which
        screen — the notebook pages and the control stand are the two places where
        the space is fixed and a long sentence loses its end.
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: What it should say
      description: If you know. If you do not, the report is still worth having.
    validations:
      required: false
