name: I am translating Railroader into a language
description: Say which language you are taking, so two people do not do the same one.
title: "[LANG] "
labels: ["language"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Read [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) before you
        start — most of it is about what the game does to the file, not about style.

        You do **not** need to know git. If you would rather not use it, translate
        the files and attach them to this issue; the pull request will be opened for
        you and you will still be credited as the translator.
  - type: input
    id: language
    attributes:
      label: Language
      description: >
        The name of the language, and the folder code Project Zomboid uses for it —
        one of AR CA CH CN CS DA DE ES ES_CL ES_MX FI FR HU ID IT JP KO NL NO PL PT
        PTBR RO RU TH TR UA. If your language is not in that list, say so: it needs
        a language.txt of its own and that is a decision before it is work.
      placeholder: Polish (PL)
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: How you want to be credited
      description: Spelled exactly as you want it to appear, everywhere.
    validations:
      required: false
  - type: textarea
    id: about
    attributes:
      label: Anything worth knowing
      description: >
        Do you know the game? Do you know railways? Neither is required — but if you
        do know railways, say so, because the glossary is where translations of this
        mod go wrong.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I have read [TERMS.md](../blob/main/TERMS.md) and agree to them.
          required: true
